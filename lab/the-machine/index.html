<title>The Machine — how Meta's ad delivery system works · The Growth Den Lab</title>
<meta name="description" content="Follow one impression through Meta's ad delivery pipeline — retrieval, ranking, the value equation, the auction — in the ~100ms before an ad appears.">

<style>
/* ============ The Machine · The Growth Den Lab ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  /* Growth Den palette, from the main site's tokens */
  --purple:  #341f44;
  --deep:    #1a1025;
  --blue:    #256493;
  --red:     #e5340b;
  --orange:  #fe7c2b;
  --gold:    #ffc545;
  --sky:     #7fc8f0;
  --green:   #8fd694;
  --cream:   #fcf3d6;
  --white:   #fefefe;
  --muted:   rgba(252,243,214,.62);
  --line:    rgba(252,243,214,.14);
  --glass:   rgba(26,16,37,.68);
  --r: 20px;

  /* RESERVED across every visualization in every tab:
     this color means "your ad" and is never used for anything else. */
  --your-ad: #fe7c2b;

  --topbar-h: 62px;
  --tabs-h: 54px;
  --pin-top: calc(var(--topbar-h) + var(--tabs-h));
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Poppins', sans-serif;
  font-weight: 300;
  color: var(--cream);
  background: var(--purple);
  background-image:
    radial-gradient(ellipse 90% 55% at 75% 5%, rgba(37,100,147,.38) 0%, transparent 60%),
    radial-gradient(ellipse 55% 40% at 8% 95%, rgba(229,52,11,.13) 0%, transparent 55%),
    repeating-linear-gradient(0deg, transparent 0 34px, rgba(252,243,214,.022) 34px 35px),
    repeating-linear-gradient(90deg, transparent 0 34px, rgba(252,243,214,.022) 34px 35px);
  background-attachment: fixed;
  min-height: 100dvh;
  display: flex; flex-direction: column;
}

img { display: block; max-width: 100%; }
a { color: var(--gold); }
b { font-weight: 600; }

/* ---------- depth registers: stacked in place so the layout engine
     reserves the tallest register per block — no shift on switch ---------- */
.d3 { display: grid; }
.d3 > span { grid-area: 1 / 1; transition: opacity .32s ease; }
body.d-kid .d3 > .cmo, body.d-kid .d3 > .pro,
body.d-cmo .d3 > .kid, body.d-cmo .d3 > .pro,
body.d-pro .d3 > .kid, body.d-pro .d3 > .cmo { opacity: 0; pointer-events: none; user-select: none; }

/* ---------- top bar ---------- */
#topbar {
  height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 16px;
  position: sticky; top: 0; z-index: 50;
  background: rgba(26,16,37,.88); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; min-width: 0; }
.logo img { height: 32px; width: auto; }
.lab-tag {
  font-size: 11px; font-weight: 700; letter-spacing: .14em;
  color: var(--deep); background: var(--gold);
  padding: 2px 10px; border-radius: 100px; transform: rotate(-3deg);
  white-space: nowrap;
}

/* the Depth Dial */
#dial {
  display: flex; border: 1.5px solid rgba(252,243,214,.45); border-radius: 100px;
  overflow: hidden; background: rgba(26,16,37,.7); flex: 0 0 auto;
}
.dial-btn {
  font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 12px;
  border: none; background: transparent; color: var(--muted);
  padding: 9px 13px; cursor: pointer; white-space: nowrap; min-height: 40px;
  transition: background .25s, color .25s;
}
.dial-btn.active { background: var(--cream); color: var(--deep); font-weight: 700; }
.dial-btn .short { display: none; }
@media (max-width: 640px) {
  .dial-btn { padding: 9px 10px; font-size: 11.5px; }
  .dial-btn .full { display: none; }
  .dial-btn .short { display: inline; }
}

/* ---------- tab pill bar ---------- */
#tabbar {
  position: sticky; top: var(--topbar-h); z-index: 40;
  background: rgba(26,16,37,.82); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
#tabbar .rail {
  display: flex; gap: 8px; align-items: center;
  max-width: 1100px; margin: 0 auto;
  padding: 8px 16px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#tabbar .rail::-webkit-scrollbar { display: none; }
.tab-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 500; color: var(--muted);
  text-decoration: none; white-space: nowrap;
  border: 1.5px solid transparent; border-radius: 100px;
  padding: 8px 14px; min-height: 38px;
  transition: color .2s, border-color .2s, background .2s;
}
.tab-pill:hover { color: var(--cream); border-color: rgba(252,243,214,.3); }
.tab-pill[aria-current="page"] {
  color: var(--deep); font-weight: 700;
  background: var(--gold); border-color: var(--gold);
}
.tab-pill .ico { font-size: 15px; }

/* ---------- view ---------- */
#view { flex: 1; width: 100%; animation: view-in .3s ease; }
.view-pad { max-width: 1100px; margin: 0 auto; padding: 34px 20px 30px; }
@keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.room-kicker {
  font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
  color: var(--your-ad); margin-bottom: 10px;
}
h1.room-title {
  font-size: clamp(30px, 5vw, 46px); font-weight: 800; letter-spacing: -.01em;
  color: var(--white); line-height: 1.1; margin-bottom: 10px;
}
.room-tag { font-size: 16px; color: var(--muted); line-height: 1.6; max-width: 680px; margin-bottom: 8px; }

.card {
  background: var(--glass); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: var(--r);
  padding: 22px 22px 20px; margin-bottom: 16px;
  box-shadow: 0 18px 44px rgba(0,0,0,.32);
}
.card h2 { font-size: 19px; font-weight: 700; color: var(--white); margin-bottom: 10px; }
.card p, .card li { font-size: 14.5px; line-height: 1.7; color: var(--muted); }
.card p { margin-bottom: 10px; }
.card p:last-child { margin-bottom: 0; }
.card b { color: var(--cream); }
.card i { color: var(--cream); }

/* room directory grid */
.dir-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 6px; }
.dir-card {
  display: flex; flex-direction: column; gap: 6px;
  background: rgba(252,243,214,.05); border: 1.5px solid var(--line); border-radius: 16px;
  padding: 16px; text-decoration: none;
  transition: border-color .2s, transform .15s;
}
.dir-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.dir-card .dc-name { font-size: 15px; font-weight: 700; color: var(--cream); }
.dir-card .dc-tag { font-size: 12.5px; line-height: 1.55; color: var(--muted); }
.dir-card .dc-state {
  align-self: flex-start; margin-top: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--deep); background: var(--sky); border-radius: 100px; padding: 2px 9px;
}
.dir-card .dc-state.open { background: var(--gold); }

/* ---------- confidence meter ---------- */
.claim-line { position: relative; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Poppins', sans-serif; font-size: 10.5px; font-weight: 700;
  letter-spacing: .06em; vertical-align: 2px;
  border: 1.2px solid; border-radius: 100px;
  padding: 1px 8px; margin-left: 7px; cursor: pointer;
  background: rgba(26,16,37,.55); line-height: 1.7;
}
.badge .sym { font-size: 10px; }
.badge.g-meta { color: var(--gold); border-color: rgba(255,197,69,.55); }
.badge.g-measured { color: var(--sky); border-color: rgba(127,200,240,.55); }
.badge.g-folklore { color: var(--muted); border-color: rgba(252,243,214,.35); }
.badge:hover { filter: brightness(1.2); }

#popover {
  position: fixed; z-index: 80; max-width: 300px;
  background: var(--white); color: var(--deep);
  border-radius: 14px; padding: 13px 15px;
  box-shadow: 0 16px 44px rgba(0,0,0,.5);
  font-size: 12.5px; line-height: 1.55;
  animation: pop-in .16s ease;
}
@keyframes pop-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
#popover .po-grade { font-weight: 800; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
#popover .po-src { font-weight: 600; }
#popover a { color: var(--blue); font-weight: 600; }
#popover .po-note { color: #6b5f78; margin-top: 4px; }

.legend-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 2px; }
.legend-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }

/* ---------- the journey (pinned scroll scenes) ---------- */
.jstep { position: relative; min-height: 235svh; }
.jpin {
  position: sticky; top: var(--pin-top);
  height: calc(100svh - var(--pin-top));
  display: flex; align-items: center; overflow: hidden;
}
.jgrid {
  width: 100%; max-width: 1100px; margin: 0 auto;
  padding: 14px 20px;
  display: grid; grid-template-columns: minmax(300px, 420px) 1fr;
  gap: 28px; align-items: center; height: 100%;
}
.jcopy h2 { font-size: clamp(22px, 2.6vw, 32px); font-weight: 700; line-height: 1.16; color: var(--white); margin-bottom: 12px; }
.jcopy .jbody p { font-size: 14px; line-height: 1.68; color: var(--muted); margin-bottom: 10px; }
.jcopy .jbody b, .jcopy .jbody i { color: var(--cream); }
.jcopy .jclaims { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
.jcopy .jclaims p { font-size: 12.5px; line-height: 1.65; color: var(--muted); margin-bottom: 8px; }

.jstage {
  position: relative; height: min(76svh, 640px); min-height: 340px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: rgba(15,9,24,.72); overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,.4);
}
.jstage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; }
.jcap {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  text-align: center; font-size: 13px; font-weight: 500; color: var(--cream);
  background: rgba(26,16,37,.82); backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px;
  pointer-events: none; min-height: 36px;
  display: grid; align-items: center;
}
.jcap > * { grid-area: 1 / 1; }

/* slow-mo scrubber (retrieval scene) */
.scrub {
  position: absolute; left: 14px; right: 14px; bottom: 58px;
  display: flex; align-items: center; gap: 10px;
  background: rgba(26,16,37,.82); border: 1px solid var(--line);
  border-radius: 100px; padding: 6px 14px;
}
.scrub label { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.scrub input[type="range"] {
  -webkit-appearance: none; appearance: none; flex: 1;
  height: 28px; background: transparent; cursor: pointer;
}
.scrub input::-webkit-slider-runnable-track { height: 5px; border-radius: 4px; background: rgba(252,243,214,.2); }
.scrub input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; margin-top: -7.5px; border-radius: 50%;
  background: var(--gold); border: 2px solid var(--deep);
}
.scrub input::-moz-range-track { height: 5px; border-radius: 4px; background: rgba(252,243,214,.2); }
.scrub input::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); border: 2px solid var(--deep); }

/* tap-to-advance (touch devices) */
.jnext {
  display: none;
  position: absolute; right: 12px; top: 12px; z-index: 5;
  font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 12px;
  color: var(--cream); background: rgba(26,16,37,.8);
  border: 1.5px solid rgba(252,243,214,.4); border-radius: 100px;
  padding: 8px 14px; min-height: 38px; cursor: pointer;
}
@media (hover: none) { .jnext { display: inline-flex; align-items: center; gap: 5px; } }

/* ---------- pipeline diagram ---------- */
.map-wrap { overflow-x: auto; }
#pipemap { width: 100%; min-width: 560px; height: auto; display: block; }
#pipemap .node { cursor: pointer; }
#pipemap .node rect { fill: rgba(252,243,214,.06); stroke: rgba(252,243,214,.4); stroke-width: 1.4; rx: 12; transition: stroke .2s; }
#pipemap .node:hover rect { stroke: var(--gold); }
#pipemap .node text { fill: var(--cream); font-family: 'Poppins', sans-serif; }
#pipemap .n-name { font-size: 13px; font-weight: 700; }
#pipemap .n-sub { font-size: 9.5px; fill: rgba(252,243,214,.55); }
#pipemap .edge { stroke: rgba(252,243,214,.55); stroke-width: 2; fill: none; marker-end: url(#arrow); }
#pipemap .edge.inferred { stroke: var(--gold); stroke-dasharray: 6 6; opacity: .8; }
#pipemap .e-label { font-size: 9px; fill: rgba(252,243,214,.5); font-family: 'Poppins', sans-serif; }
#pipemap .e-label.inf { fill: var(--gold); font-weight: 600; }
.map-legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.map-legend .lg { display: inline-flex; align-items: center; gap: 8px; }
.map-legend .lg i { display: inline-block; width: 34px; height: 0; border-top: 2px solid rgba(252,243,214,.55); }
.map-legend .lg i.dash { border-top: 2px dashed var(--gold); }

/* node detail modal */
#detail {
  position: fixed; inset: 0; z-index: 90;
  display: flex; align-items: center; justify-content: center;
  background: rgba(15,9,24,.7); backdrop-filter: blur(4px);
  padding: 20px;
}
#detail[hidden] { display: none; }
.detail-card {
  width: min(560px, 100%); max-height: 82svh; overflow-y: auto;
  background: var(--glass); border: 1px solid rgba(252,243,214,.3);
  border-radius: var(--r); padding: 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
}
.detail-card h3 { font-size: 20px; font-weight: 700; color: var(--white); margin-bottom: 10px; padding-right: 40px; }
.detail-card p { font-size: 14px; line-height: 1.7; color: var(--muted); margin-bottom: 10px; }
.detail-card b { color: var(--cream); }
.detail-close {
  position: absolute; margin-left: auto;
  float: right;
  font-size: 16px; font-weight: 700; color: var(--cream);
  background: rgba(252,243,214,.1); border: 1.5px solid rgba(252,243,214,.35);
  border-radius: 50%; width: 36px; height: 36px; cursor: pointer;
}

/* closing panel */
.close-panel { text-align: center; padding: 40px 24px; }
.close-panel h2 { font-size: clamp(24px, 3.4vw, 36px); margin-bottom: 12px; }
.close-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }
.big-btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px;
  color: var(--white); background: var(--your-ad);
  border: none; border-radius: 100px; padding: 14px 26px; min-height: 50px;
  text-decoration: none; cursor: pointer;
  box-shadow: 0 4px 20px rgba(254,124,43,.45);
  transition: transform .15s;
}
.big-btn:hover { transform: translateY(-2px); }
.big-btn.ghost { background: transparent; color: var(--cream); border: 2px solid rgba(252,243,214,.45); box-shadow: none; }

/* ---------- auction floor ---------- */
.sim-grid { display: grid; grid-template-columns: 1fr 350px; gap: 16px; align-items: start; }
.sim-stage {
  position: relative; height: 480px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: rgba(15,9,24,.72); overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,.4);
}
.sim-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.sim-cap {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  font-size: 12.5px; color: var(--cream); text-align: center;
  background: rgba(26,16,37,.85); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px 12px; min-height: 34px;
  display: grid; align-items: center; pointer-events: none;
}
.sim-cap > * { grid-area: 1 / 1; }
.ctl { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.ctl-name { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--cream); display: flex; justify-content: space-between; }
.ctl-name b { color: var(--your-ad); font-size: 14px; }
.ctl input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; cursor: pointer; }
.ctl input[type="range"]::-webkit-slider-runnable-track { height: 7px; border-radius: 5px; background: rgba(252,243,214,.16); }
.ctl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 24px; height: 24px; margin-top: -8.5px;
  border-radius: 50%; background: var(--your-ad); border: 3px solid var(--deep);
  box-shadow: 0 0 10px rgba(254,124,43,.6);
}
.ctl input[type="range"]::-moz-range-track { height: 7px; border-radius: 5px; background: rgba(252,243,214,.16); }
.ctl input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--your-ad); border: 3px solid var(--deep); }
.fresh-bar { height: 12px; border-radius: 7px; background: rgba(252,243,214,.14); overflow: hidden; }
.fresh-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--your-ad), var(--gold)); transition: width .3s; }
.chip-btn {
  font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 12px;
  color: var(--cream); background: transparent;
  border: 1.5px solid rgba(252,243,214,.4); border-radius: 100px;
  padding: 8px 14px; min-height: 38px; cursor: pointer;
}
.chip-btn:hover { border-color: var(--cream); }
.chip-btn.pressed { background: var(--red); border-color: var(--red); color: var(--white); }
.run-btn {
  font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px;
  background: var(--your-ad); color: var(--white);
  border: none; border-radius: 100px; padding: 12px 22px; min-height: 48px; cursor: pointer;
  box-shadow: 0 4px 18px rgba(254,124,43,.45);
}
.run-btn:active { transform: scale(.97); }
.run-btn.ghost { background: transparent; color: var(--cream); border: 2px solid rgba(252,243,214,.45); box-shadow: none; }
.run-btn.ghost.pressed { background: var(--gold); color: var(--deep); border-color: var(--gold); }
.sim-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.sstat { background: rgba(252,243,214,.06); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.sstat span { display: block; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sstat b { font-size: 17px; color: var(--cream); }
.sstat.hero b { color: var(--your-ad); }
.sstat .sub { font-size: 10.5px; color: var(--muted); }
.scen-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
.scen-cap { min-height: 40px; font-size: 13.5px; line-height: 1.6; color: var(--muted); }
.scen-cap b { color: var(--cream); }
.cmp-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
.cmp-table th, .cmp-table td { padding: 6px 10px; text-align: left; border-bottom: 1px dashed var(--line); color: var(--muted); }
.cmp-table th { color: var(--cream); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.cmp-table .you-row td { color: var(--your-ad); font-weight: 600; }
.next-room {
  display: flex; flex-direction: column; gap: 4px;
  border: 1.5px solid rgba(255,197,69,.5); border-radius: var(--r);
  background: var(--glass); padding: 20px 24px; text-decoration: none;
  transition: transform .15s, border-color .2s; margin-bottom: 16px;
}
.next-room:hover { transform: translateY(-2px); border-color: var(--gold); }
.next-room .nr-k { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.next-room .nr-t { font-size: 20px; font-weight: 800; color: var(--white); }
@media (max-width: 900px) {
  .sim-grid { grid-template-columns: 1fr; }
  .sim-stage { height: 340px; }
}

/* ---------- the model room (hall of machines) ---------- */
.hall-wrap { position: relative; }
.hall {
  display: flex; gap: 0; align-items: stretch;
  overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 6px 2px 16px; scrollbar-width: none;
}
.hall::-webkit-scrollbar { display: none; }
.roomcard {
  flex: 0 0 min(600px, 88vw); scroll-snap-align: center;

    pro: '<p>One impression opportunity. Tens of millions of eligible candidates. A latency budget on the order of 100ms, end to end.</p><p>The modern stack frames this as <b>candidate selection per user</b>, not audience qualification per ad — retrieval is user-conditioned from the very first stage. That inversion, formalized in Meta’s 2024-onward retrieval and ranking rebuild, is the structural reason account-level targeting lost leverage and creative gained it.</p>',
  },

  'j.retr.body': {
    kid: '<p>Nobody can read forty million signs one at a time — not even the fast helper. So the fair is organized like shelves inside shelves. Whole neighborhoods of signs get skipped in a single glance. Then whole rows. Then whole boxes. In a few blinks, only a few thousand signs that might fit this visitor are left standing.</p><p>Try the slow-motion slider on the scene — the sweep is worth watching twice.</p>',
    cmo: '<p>No system scores tens of millions of ads individually in real time. The first stage — Meta calls its engine <b>Andromeda</b> — prunes the universe hierarchically: discard almost everything cheaply, keep a few thousand plausible candidates for real scoring.</p><p>For your budget, this is the stage that decides whether your ad is even <i>in the room</i>. What gets you into the room is signal the system can index — creative that says clearly who it is for.</p>',
    pro: '<p><b>Andromeda</b> is the NN-based retrieval layer: a hierarchical index sweep that takes the eligible set from tens of millions to a few thousand in single-digit milliseconds, spending almost nothing per discarded candidate.</p><p>Retrieval is learned, not rules-based — there is no interest-checkbox gate to game. Drag the scrubber to replay the collapse slowly; each band is an index level lighting up and dimming.</p>',

  'j.value.body': {
    kid: '<p>For each finalist the judge fills in a little scorecard with three parts. How many tickets is the kid offering the fair? How likely is <i>this visitor</i> to actually want the lemonade — judged by what they did in the last hour, not what they wore last summer? And is the sign honest and kind, or tricky and loud?</p><p>Money, want, niceness. All three, every single time.</p>',
    cmo: '<p>Every finalist gets the same three-part score, assembled fresh for this person. Your <b>bid</b> is the only part you set directly. The <b>estimated action rate</b> is the machine’s live guess that this person will act — built from their recent behavior in sequence, which is why timing and relevance beat demographic theory. And <b>quality</b> adds or subtracts: the penalties for bait and bad landing pages are documented, and they price like a tax.</p><p>Two of the three terms, you earn with the ad itself. That is where the leverage moved.</p>',
    pro: '<p><b>total value = bid × estimated action rate + quality</b>, computed per person per auction. The eAR comes from the sequence-aware rankers — GEM-lineage models ingest ordered event sequences up to thousands of actions long, so recency is a first-class model input, not a static profile attribute.</p><p>Quality carries documented negative terms — hide and report rates, engagement-bait patterns, poor post-click landing experience — alongside positive ones. Bid is the only term money touches directly.</p>',

  'j.auct.body': {
    kid: '<p>The finalists’ scores rise like thermometers, and the tallest one wins the visitor. Then comes the fair’s kindest rule: the winner doesn’t hand over everything they offered — only just enough to beat second place.</p><p>And the sign is up. All of it — the sweep, the judging, the scorecards, the race — happened faster than your blink.</p>',
    cmo: '<p>Highest total value takes the impression, and the winner is charged the <b>minimum needed to win</b>, not its bid. Read that as a standing discount for good creative: a stronger action rate and clean quality let a smaller bid clear the same auction.</p><p>Then the ad renders. The entire pipeline — retrieval, ranking, scoring, clearing — fits inside about a tenth of a second, and it reruns from scratch for the next slot.</p>',

  'm.intro': {
    kid: '<p>Behind the fair there is a long hallway of machine rooms — the actual contraptions that run everything you have seen so far. Walk the hall and peek into each one. Some doors have solid signs (Meta showed us what is inside), and the dashed ropes between rooms mean we are guessing how they connect.</p>',

    pro: '<p>The named stack, room by room: Andromeda (retrieval), GEM (foundation model), Lattice (ranking consolidation), the pre-2024 museum, and the stated roadmap. Claims are badged; inter-system wiring is dashed wherever Meta has not published the linkage. Swipe or use the arrows.</p>',

  /* ============ recency & fatigue ============ */
  'r.intro': {
    kid: '<p>The machine never asks who you are. It watches what you <b>just did</b> — in order — and guesses what you want next. For the next minute, you get to be the machine. Read each visitor’s little story and make the guess yourself.</p>',

  'r.g.r1': {
    kid: '<b>Easy one!</b> The story goes: watched shoes, searched shoes, almost bought shoes — all in the last few minutes. The freshest, strongest wish wins: show the shoes.',

  'r.g.r5': {
    kid: '<b>It didn’t listen. It didn’t need to.</b> Look at the hidden part of the story that just unfolded — the machine had a week of quiet little clues. The spooky ad was a <b>prediction</b>, like a weather forecast that happens to be about you.',
    cmo: '<b>No microphone required.</b> Expand the sequence and the ad explains itself: household and lookalike signals, a nine-day-old Reel view, a price check. The prediction preceded the dinner conversation — you talked about desks <i>because</i> desk-thoughts were already in your week.',

  'r.myth': {
    kid: '<p><b>So… is the phone listening?</b> It really, truly isn’t — and here is the whole story, because you deserve the whole story.</p><p>The feeling is real. You talk about something, and the ad shows up. That is genuinely spooky, and nobody should laugh at you for wondering.</p><p>But scientists have hooked phones up to machines that watch every single thing the phone sends, waiting to catch it whispering. It doesn’t. Listening to everyone all day would take mountains of computer power, it would show up in your battery, and it would break serious laws.</p><p>Here is the secret nobody tells you: the machine doesn’t need your voice. Your taps and pauses and searches already tell it what you’re about to want — sometimes before <i>you</i> notice. The truth is stranger than the myth: nobody is listening, and it still knows.</p>',
    cmo: '<p><b>The microphone myth, handled completely.</b> The experience driving it is real and common: conversation, then the ad. Dismissing it insults your customers’ pattern recognition — they noticed something true. They just attributed it wrong.</p><p>The evidence against audio capture is strong: network-traffic studies have specifically hunted for it and found nothing; always-on transcription at billions-of-users scale would be a visible compute and battery signature; and the legal exposure would dwarf any targeting benefit. Meta denies it on the record, and — more persuasively — doesn’t need it.</p><p>What actually happens: sequences. The topic entered the household’s behavior stream days earlier — a search on shared wifi, a friend’s purchase, a Reel half-watched. The conversation and the ad are both downstream of the same signals. For your brand, the lesson is practical: you don’t need creepy data to be uncannily relevant. You need to catch moments.</p>',
    pro: '<p><b>Full treatment, no strawmen.</b> Claim: ambient audio drives ad targeting. Against it: (1) independent traffic analyses — notably the 2018 Northeastern study instrumenting 17,000+ apps — found no evidence of covert audio exfiltration; (2) the compute, battery, and bandwidth signature of always-on ASR at Meta’s scale would be detectable and enormous; (3) wiretap-adjacent legal exposure is asymmetric to the marginal targeting lift; (4) sequence prediction from behavioral, household, and graph signals already produces the observed uncanny relevance — the myth survives because the <i>outputs</i> are indistinguishable to the person experiencing them.</p><p>The professional takeaway: uncanny timing is a property of sequence models operating on shared-environment signals. Build for it honestly — moment-level creative against behavioral triggers — and you get the “how did they know” effect without touching a microphone.</p>',

  'r.court': {
    kid: '<p>Now the courtroom! Grown-ups say lots of confident things about ads getting “worn out.” Each claim goes on trial: some are just campfire stories, some are half-true, and one is written in the fair’s own rulebook. Poke the little charts to see for yourself.</p>',
    cmo: '<p>Fatigue folklore, on trial. Four claims your team has probably repeated in a meeting — each gets a verdict, a badge, and an interactive exhibit. The pattern to notice: Meta’s actual fatigue machinery is <b>cost-based</b>, while the folklore is <b>frequency-number</b>-based.</p>',

/* ---------------- rooms / depth ---------------- */
var ROOMS = [
  { slug: 'machine',    name: 'The Machine',       ico: '⚙️', open: true },
  { slug: 'models',     name: 'The Model Room',    ico: '🧠', open: true },
  { slug: 'auction',    name: 'The Auction Floor', ico: '🔨', open: true },
  { slug: 'recency',    name: 'Recency & Fatigue', ico: '🔁', open: true },
  { slug: 'creative',   name: 'Creative Signal',   ico: '📡', open: true },
  { slug: 'scanner',    name: 'Brand Scanner',     ico: '🔍', open: false },
  { slug: 'dispatch',   name: 'The Dispatch',      ico: '📰', open: true },
];
var DEPTHS = ['kid', 'cmo', 'pro'];
var DEPTH_KEY = 'gd-machine-depth';
/* room registries: each room may register a view builder and an init
   that returns a cleanup fn (declared early — rooms assign into these) */
var VIEWS = {}, INITS = {}, roomCleanup = null;

function storedDepth() {
  try {
    var d = localStorage.getItem(DEPTH_KEY);
    if (DEPTHS.indexOf(d) >= 0) return d;
    var legacy = localStorage.getItem('gd-auction-mode');
    if (legacy === 'kid' || legacy === 'cmo') return legacy;
  } catch (e) { }
  return 'cmo';
}
var depth = storedDepth();

function setDepth(d, fromUrl) {
  if (DEPTHS.indexOf(d) < 0) d = 'cmo';
  depth = d;
  document.body.classList.remove('d-kid', 'd-cmo', 'd-pro');
  document.body.classList.add('d-' + d);
  document.querySelectorAll('.dial-btn').forEach(function (b) {
    b.classList.toggle('active', b.dataset.depth === d);
  });
  try { localStorage.setItem(DEPTH_KEY, d); } catch (e) { }
  if (!fromUrl) canonicalizeHash();
}

/* d3(key): all three registers stacked in one grid cell — the browser
   reserves the tallest register, so a dial flip never shifts layout. */
function d3(key) {
  var c = CONTENT[key];
  if (!c) return '<span class="d3"><span>[' + key + ']</span></span>';
  return '<span class="d3">' +
    '<span class="kid">' + c.kid + '</span>' +
    '<span class="cmo">' + c.cmo + '</span>' +
    '<span class="pro">' + c.pro + '</span></span>';
}
/* register-aware text for canvas drawing (redrawn every frame) */
function dtxt(k, c, p) { return depth === 'kid' ? k : depth === 'cmo' ? c : p; }

/* ---------------- confidence meter ---------------- */
var GRADES = {
  meta:     { sym: '●', label: 'Meta-published',         cls: 'g-meta',
              note: 'Straight from Meta’s own published documentation.' },
  measured: { sym: '◐', label: 'Independently measured', cls: 'g-measured',
              note: 'Measured by researchers outside Meta.' },
  folklore: { sym: '○', label: 'Practitioner folklore',  cls: 'g-folklore',
              note: 'Widely repeated, never independently verified.' },
};
var CLAIMS = [];

function claim(text, grade, sourceName, sourceUrl) {
  var g = GRADES[grade] || GRADES.folklore;
  var idx = CLAIMS.length;
  CLAIMS.push({ grade: grade, sourceName: sourceName || null, sourceUrl: sourceUrl || null });
  return '<span class="claim-line">' + text +
    '<button class="badge ' + g.cls + '" type="button" data-claim="' + idx + '"' +
    ' title="' + g.label + (grade === 'folklore' ? ' — ' + g.note : '') + '"' +
    ' aria-label="Evidence: ' + g.label + '">' +
    '<span class="sym">' + g.sym + '</span>' + g.label + '</button></span>';
}

var popover = $('popover');
function openPopover(badgeEl) {
  var data = CLAIMS[parseInt(badgeEl.dataset.claim, 10)];
  if (!data) return;
  var g = GRADES[data.grade] || GRADES.folklore;
  var html = '<div class="po-grade">' + g.sym + ' ' + g.label + '</div>';
  if (data.sourceName) html += '<div class="po-src">' + data.sourceName + '</div>';
  if (data.sourceUrl) html += '<a href="' + data.sourceUrl + '" target="_blank" rel="noopener noreferrer">open source ↗</a>';
  html += '<div class="po-note">' + g.note + '</div>';
  popover.innerHTML = html;
  popover.hidden = false;
  var r = badgeEl.getBoundingClientRect();
  var pw = Math.min(300, window.innerWidth - 24);
  popover.style.maxWidth = pw + 'px';
  var left = Math.max(12, Math.min(r.left, window.innerWidth - pw - 12));
  var top = r.bottom + 8;
  if (top + 150 > window.innerHeight) top = Math.max(12, r.top - 8 - 130);
  popover.style.left = left + 'px';
  popover.style.top = top + 'px';
}
document.addEventListener('pointerdown', function (e) {
  var badge = e.target.closest('.badge');
  if (badge && badge.dataset.claim !== undefined) { e.preventDefault(); openPopover(badge); return; }
  if (!e.target.closest('#popover')) popover.hidden = true;
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { popover.hidden = true; $('detail').hidden = true; }
});

/* ---------------- routing ---------------- */
function parseHash() {
  var h = location.hash.replace(/^#\/?/, '');
  var q = h.split('?');
  var slug = q[0].replace(/\/+$/, '') || 'machine';
  var params = {};
  (q[1] || '').split('&').forEach(function (kv) {
    var p = kv.split('=');
    if (p[0]) params[p[0]] = decodeURIComponent(p[1] || '');
  });
  if (slug === 'model-room') slug = 'models';   // legacy alias
  if (!ROOMS.some(function (r) { return r.slug === slug; })) slug = 'machine';
  return { slug: slug, params: params };
}
function canonicalizeHash() {
  var cur = parseHash();
  history.replaceState(null, '', '#/' + cur.slug + '?d=' + depth);
}
function roomLink(slug) { return '#/' + slug; }

function renderTabs(active) {
  $('tabRail').innerHTML = ROOMS.map(function (r) {
    return '<a class="tab-pill" href="' + roomLink(r.slug) + '"' +
      (r.slug === active ? ' aria-current="page"' : '') + '>' +
      '<span class="ico">' + r.ico + '</span>' + r.name + '</a>';
  }).join('');
  var cur = $('tabRail').querySelector('[aria-current]');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
}

/* ============================================================
   SCENES — canvas engine
   ============================================================ */
var J = {
  active: false, raf: 0, scenes: {}, running: new Set ? new Set() : null,
  galaxy: null, lastScroll: 0,
};

function makeGalaxy(w, h) {
  // a pre-rendered field of thousands of faint dots: the "tens of millions" illusion
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var x = c.getContext('2d');
  for (var i = 0; i < 2600; i++) {
    var a = Math.random();
    x.fillStyle = 'rgba(' + (a > .7 ? '190,200,235' : '232,222,240') + ',' + (0.05 + Math.random() * 0.22) + ')';
    var r = Math.random() * 1.4 + 0.3;
    x.beginPath();
    x.arc(Math.random() * w, Math.random() * h, r, 0, 6.29);
    x.fill();
  }
  return c;
}

function sceneBase(sectionEl) {
  var stage = sectionEl.querySelector('.jstage');
  var canvas = stage.querySelector('canvas');
  var cap = stage.querySelector('.jcap');
  return {
    el: sectionEl, stage: stage, canvas: canvas, ctx: canvas.getContext('2d'),
    cap: cap, capKey: '', w: 0, h: 0, dpr: 1, t: 0, progress: 0, ready: false,
    setCap: function (key) {
      if (key === this.capKey) return;
      this.capKey = key;
      this.cap.innerHTML = d3(key);
    },
    resize: function () {
      var r = this.stage.getBoundingClientRect();
      if (r.width < 10) return;
      this.dpr = Math.min(2, window.devicePixelRatio || 1);
      this.w = r.width; this.h = r.height;
      this.canvas.width = Math.round(r.width * this.dpr);
      this.canvas.height = Math.round(r.height * this.dpr);
      this.build(this.w, this.h);
      this.ready = true;
    },
    frame: function (dt) {
      if (!this.ready) { this.resize(); if (!this.ready) return; }
      this.t += dt;
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this.ctx.clearRect(0, 0, this.w, this.h);
      this.tick(dt, this.t);
    },
    build: function () { }, tick: function () { },
  };
}

function dotCount(w, h, base) {
  return clamp(Math.round(base * (w * h) / (900 * 560)), Math.round(base * .35), base);
}
function fmtN(n) { return Math.round(n).toLocaleString('en-US'); }
function glow(ctx, x, y, r, color, blur) {
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = blur || 12;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill();
  ctx.restore();
}

/* ---- scene 1: someone opens Instagram ---- */
function openScene(sc) {
  var dots = [];
  sc.build = function (w, h) {
    J.galaxy = makeGalaxy(Math.round(w), Math.round(h));
    dots = [];
    var n = dotCount(w, h, 420);
    for (var i = 0; i < n; i++) {
      dots.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - .5) * .006, vy: (Math.random() - .5) * .006,
        r: .8 + Math.random() * 1.8, tw: Math.random() * 6.28,
        you: i === 37,
      });
    }
  };
  sc.tick = function (dt, t) {
    var ctx = sc.ctx, w = sc.w, h = sc.h, p = sc.progress;
    var pa = clamp(p / .3, 0, 1), pb = clamp((p - .3) / .35, 0, 1), pc = clamp((p - .68) / .32, 0, 1);

    // the crowd of candidates fades in
    if (pb > 0) {
      ctx.globalAlpha = pb * .8;
      ctx.drawImage(J.galaxy, 0, 0, w, h);
      ctx.globalAlpha = 1;
      dots.forEach(function (d) {
        d.x += d.vx * dt; d.y += d.vy * dt;
        if (d.x < 0 || d.x > 1) d.vx *= -1;
        if (d.y < 0 || d.y > 1) d.vy *= -1;
        var a = pb * (.35 + .4 * Math.abs(Math.sin(t * 1.3 + d.tw)));
        if (d.you) {
          glow(ctx, d.x * w, d.y * h, 3 + Math.sin(t * 2.5) * .8, 'rgba(254,124,43,' + (pb * .95) + ')', 14);
        } else {
          ctx.fillStyle = 'rgba(232,222,240,' + a + ')';
          ctx.beginPath(); ctx.arc(d.x * w, d.y * h, d.r, 0, 6.29); ctx.fill();
        }
      });
    }

    // the person and their phone
    var px = w * .5, py = h * .52;
    var phW = 56, phH = 100;
    ctx.save();
    ctx.strokeStyle = 'rgba(252,243,214,' + (.6 + pa * .4) + ')';
    ctx.lineWidth = 2.5;
    ctx.fillStyle = 'rgba(26,16,37,.9)';
    ctx.beginPath(); ctx.roundRect(px - phW / 2, py - phH / 2, phW, phH, 12); ctx.fill(); ctx.stroke();
    // empty slot inside the phone
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(252,243,214,' + (.25 + .35 * Math.abs(Math.sin(t * 2))) + ')';
    ctx.strokeRect(px - phW / 2 + 8, py - 16, phW - 16, 32);
    ctx.setLineDash([]);
    ctx.restore();
    glow(ctx, px, py - phH / 2 - 22, 7, 'rgba(252,243,214,.9)', 16);
    ctx.font = '600 11px Poppins, sans-serif';
    ctx.fillStyle = 'rgba(252,243,214,.6)';
    ctx.textAlign = 'center';
    ctx.fillText(dtxt('the visitor', 'one person', 'the request'), px, py + phH / 2 + 20);

    // candidate counter
    if (pb > 0.05) {
      var count = lerp(0, 41700000, Math.pow(pb, .6));
      ctx.font = '700 ' + Math.min(26, w * .04) + 'px Poppins, sans-serif';
      ctx.fillStyle = 'rgba(252,243,214,' + (.5 + pb * .5) + ')';
      ctx.fillText(fmtN(count), w / 2, 44);
      ctx.font = '500 11px Poppins, sans-serif';
      ctx.fillStyle = 'rgba(252,243,214,.5)';
      ctx.fillText(dtxt('signs hoping to be seen', 'eligible ads for this one slot', 'eligible candidates, this request'), w / 2, 62);
    }
    // the question
    if (pc > 0.05) {
      ctx.font = 'italic 600 ' + Math.min(19, w * .032) + 'px Poppins, sans-serif';
      ctx.fillStyle = 'rgba(255,197,69,' + pc + ')';
      ctx.fillText(dtxt('“which sign fits this visitor?”', '“which ad fits this person?”', 'user-conditioned selection, stage one'), w / 2, h - 74);
    }
    sc.setCap(p < .3 ? 'j.open.cap.a' : p < .68 ? 'j.open.cap.b' : 'j.open.cap.c');
  };
}

/* ---- scene 2: retrieval — the Andromeda collapse ---- */
function retrievalScene(sc) {
  var dots = [], scrub = null, scrubActive = false, lastStage = -1, shake = 0;
  var STAGES = [41700000, 1200000, 96000, 8400, 2000];
  sc.build = function (w, h) {
    if (!J.galaxy) J.galaxy = makeGalaxy(Math.round(w), Math.round(h));
    dots = [];
    var n = dotCount(w, h, 900);
    for (var i = 0; i < n; i++) {
      dots.push({
        x: Math.random(), y: Math.random() * .78 + .05,
        hx: Math.random(), hy: Math.random(),   // home position
        rank: Math.random(), r: .8 + Math.random() * 1.6,
        tw: Math.random() * 6.28, dead: 0, you: i === 42,
      });
    }
    dots[42].rank = 0.001; // your ad survives the sweep — this journey follows it
    scrub = sc.el.querySelector('#retScrub');
    if (scrub && !scrub.dataset.wired) {
      scrub.dataset.wired = '1';
      scrub.addEventListener('input', function () { scrubActive = true; });
      window.addEventListener('scroll', function () {
        if (scrubActive && Math.abs(window.scrollY - J.lastScroll) > 60) scrubActive = false;
      }, { passive: true });
    }
  };
  sc.tick = function (dt, t) {
    var ctx = sc.ctx, w = sc.w, h = sc.h;
    var p = scrubActive && scrub ? parseInt(scrub.value, 10) / 1000 : sc.progress;
    if (!scrubActive && scrub) scrub.value = Math.round(sc.progress * 1000);
    var cp = clamp(p / .92, 0, 1) * 4;         // 0..4 across the four index levels
    var stage = Math.floor(cp);
    if (stage !== lastStage) { if (stage > lastStage && lastStage >= 0) shake = 1; lastStage = stage; }
    shake = Math.max(0, shake - dt * 3);
    var sx = (Math.random() - .5) * shake * 7, sy = (Math.random() - .5) * shake * 7;
    ctx.save();
    ctx.translate(sx, sy);

    // galaxy dims as the universe is discarded
    if (J.galaxy) {
      ctx.globalAlpha = clamp(.75 - cp * .28, 0, .75);
      ctx.drawImage(J.galaxy, 0, 0, w, h);
      ctx.globalAlpha = 1;
    }

    // index level bands: light up in turn, then dim
    var bandH = (h * .62) / 4;
    for (var L = 0; L < 4; L++) {
      var y0 = h * .16 + L * bandH;
      var lit = clamp(1 - Math.abs(cp - (L + .5)) * 1.6, 0, 1);
      ctx.fillStyle = 'rgba(37,100,147,' + (lit * .16) + ')';
      ctx.fillRect(0, y0, w, bandH - 4);
      ctx.strokeStyle = 'rgba(127,200,240,' + (.08 + lit * .5) + ')';
      ctx.lineWidth = 1.2;
      ctx.strokeRect(6, y0, w - 12, bandH - 4);
      ctx.font = '600 10px Poppins, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(127,200,240,' + (.3 + lit * .6) + ')';
      ctx.fillText(dtxt('shelf ' + (L + 1), 'index level ' + (L + 1), 'index level ' + (L + 1)), 14, y0 + 15);
      if (lit > .1) { // sweep line
        var swx = ((t * .55 + L * .3) % 1) * w;
        var grad = ctx.createLinearGradient(swx - 70, 0, swx, 0);
        grad.addColorStop(0, 'rgba(127,200,240,0)');
        grad.addColorStop(1, 'rgba(127,200,240,' + lit * .5 + ')');
        ctx.fillStyle = grad;
        ctx.fillRect(swx - 70, y0, 70, bandH - 4);
      }
    }

    // survivors funnel toward the bottom cluster; the culled fall away
    var surviveFrac = [1, .5, .26, .12, .055][clamp(stage, 0, 4)] -
      (cp % 1) * ([1, .5, .26, .12, .055][clamp(stage, 0, 4)] - [.5, .26, .12, .055, .055][clamp(stage, 0, 4)]);
    dots.forEach(function (d) {
      var alive = d.rank < surviveFrac;
      d.dead = lerp(d.dead, alive ? 0 : 1, dt * 2.4);
      var fx, fy;
      if (alive && cp > 3.2) {
        // gather into the survivor cluster
        var g = clamp((cp - 3.2) / .8, 0, 1);
        fx = lerp(d.hx, .5 + (d.hx - .5) * .3, g);
        fy = lerp(d.hy * .78 + .05, .87 + (d.hy - .5) * .06, g);
      } else {
        fx = d.hx; fy = d.hy * .78 + .05;
      }
      var yy = fy + d.dead * .3;
      var a = (1 - d.dead) * (.3 + .5 * Math.abs(Math.sin(t * 1.4 + d.tw)));
      if (d.you) {
        glow(ctx, fx * w, yy * h, 3.4, 'rgba(254,124,43,.95)', 15);
      } else if (a > .02) {
        ctx.fillStyle = 'rgba(232,222,240,' + a + ')';
        ctx.beginPath(); ctx.arc(fx * w, yy * h, d.r, 0, 6.29); ctx.fill();
      }
    });

    // the big number
    var i0 = clamp(Math.floor(cp), 0, 4), i1 = clamp(i0 + 1, 0, 4);
    var n = Math.exp(lerp(Math.log(STAGES[i0]), Math.log(STAGES[i1]), cp % 1 || (cp >= 4 ? 1 : 0)));
    if (cp >= 4) n = STAGES[4];
    ctx.font = '800 ' + Math.min(40, w * .062) + 'px Poppins, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = cp > 3.6 ? 'rgba(255,197,69,.95)' : 'rgba(252,243,214,.9)';
    ctx.fillText(fmtN(n), w / 2, 52);
    ctx.font = '500 11px Poppins, sans-serif';
    ctx.fillStyle = 'rgba(252,243,214,.55)';
    ctx.fillText(dtxt('signs still standing', 'candidates still alive', 'candidates remaining'), w / 2, 70);

    ctx.restore();
    sc.setCap(cp < 3.4 ? 'j.retr.cap.a' : 'j.retr.cap.b');
  };
}

/* ---- scene 3: ranking — light pass, heavy pass ---- */
function rankingScene(sc) {
  var dots = [];
  sc.build = function (w, h) {
    dots = [];
    var n = dotCount(w, h, 260);
    for (var i = 0; i < n; i++) {
      dots.push({
        x: .1 + Math.random() * .8, y: .12 + Math.random() * .6,
        score: Math.random(), tw: Math.random() * 6.28,
        fx: 0, fy: 0, you: i === 21,
      });
    }
    dots[21].score = .97;
    // precompute finalist slots
    var finalists = dots.slice().sort(function (a, b) { return b.score - a.score; }).slice(0, 8);
    finalists.forEach(function (d, i) { d.finalist = true; d.slot = i; });
  };
  sc.tick = function (dt, t) {
    var ctx = sc.ctx, w = sc.w, h = sc.h, p = sc.progress;
    var pa = clamp(p / .45, 0, 1);            // light pass
    var pb = clamp((p - .5) / .5, 0, 1);      // heavy pass + lineup
    var sweepX = pa * 1.15;                    // light beam position

    // light pass beam
    if (pa > 0 && pa < 1) {
      var bx = sweepX * w;
      var grad = ctx.createLinearGradient(bx - 60, 0, bx, 0);
      grad.addColorStop(0, 'rgba(127,200,240,0)');
      grad.addColorStop(1, 'rgba(127,200,240,.35)');
      ctx.fillStyle = grad;
      ctx.fillRect(bx - 60, 0, 64, h);
    }
    // heavy pass beam dwells across the lineup
    if (pb > 0 && pb < .85) {
      var hx2 = (pb / .85) * w;
      ctx.fillStyle = 'rgba(255,197,69,.14)';
      ctx.fillRect(hx2 - 26, h * .3, 52, h * .45);
    }

    var kept = 0;
    dots.forEach(function (d) {
      var scored = sweepX > d.x;
      var keepLight = d.score > .68;                    // light pass keeps ~1/3
      var dead = scored && !keepLight ? 1 : 0;
      if (pb > 0 && !d.finalist) dead = 1;              // heavy pass keeps 8
      d.fx = lerp(d.fx || d.x, d.finalist && pb > .2 ? (.5 + (d.slot - 3.5) * .105) : d.x, dt * 2.2);
      d.fy = lerp(d.fy || d.y, d.finalist && pb > .2 ? .52 : d.y, dt * 2.2);
      var a = scored ? (dead ? .06 : .5 + d.score * .4) : .3;
      if (!dead) kept++;
      if (d.you) {
        glow(ctx, d.fx * w, d.fy * h, d.finalist && pb > .2 ? 7 : 3.6, 'rgba(254,124,43,.95)', 16);
        if (d.finalist && pb > .2) {
          ctx.font = '700 10px Poppins, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = 'rgba(254,124,43,.9)';
          ctx.fillText(dtxt('yours', 'your ad', 'your ad'), d.fx * w, d.fy * h - 14);
        }
      } else {

        ctx.beginPath();

    });

    ctx.textAlign = 'center';

}

/* ---- scene 4: the value equation ---- */
function valueScene(sc) {
  var finalists = [];
  var events = [];
  sc.build = function (w, h) {
    finalists = [];
    for (var i = 0; i < 8; i++) {
      finalists.push({
        slot: i, you: i === 2,
        bid: .3 + Math.random() * .6,
        ear: .25 + Math.random() * .55,
        q: (Math.random() - .45) * .5,
      });
    }
    finalists[2].ear = .78; finalists[2].q = .22; finalists[2].bid = .52;
    events = [];
    var glyphs = ['👟', '🔍', '❤️', '🛒', '📺', '🥤', '📱', '🎧'];
    for (var j = 0; j < 14; j++) events.push({ g: glyphs[j % glyphs.length], off: j * .55 });
  };
  sc.tick = function (dt, t) {
    var ctx = sc.ctx, w = sc.w, h = sc.h, p = sc.progress;
    var pa = clamp(p / .3, 0, 1), pb = clamp((p - .33) / .32, 0, 1), pc = clamp((p - .68) / .32, 0, 1);

    // the equation, term by term
    var eqY = 54;
    ctx.textAlign = 'center';
    var fs = Math.min(17, w * .026);
    ctx.font = '700 ' + fs + 'px Poppins, sans-serif';
    var terms = [
      { txt: dtxt('tickets', 'bid', 'bid'), col: '255,197,69', on: pa },
      { txt: ' × ', col: '252,243,214', on: 1 },
      { txt: dtxt('will-they-want-it guess', 'est. action rate', 'est. action rate'), col: '127,200,240', on: pb },
      { txt: ' + ', col: '252,243,214', on: 1 },
      { txt: dtxt('niceness', 'quality', 'quality'), col: '143,214,148', on: pc },
    ];
    var pre = dtxt('score = ', 'total value = ', 'total value = ');
    var widths = [ctx.measureText(pre).width];
    terms.forEach(function (tm) { widths.push(ctx.measureText(tm.txt).width); });
    var total = widths.reduce(function (a, b) { return a + b; }, 0);
    var x0 = w / 2 - total / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(252,243,214,.85)';
    ctx.fillText(pre, x0, eqY);
    x0 += widths[0];
    terms.forEach(function (tm, i) {
      var a = .3 + tm.on * .7;
      ctx.save();
      if (tm.on > .3 && tm.txt.trim() !== '×' && tm.txt.trim() !== '+') {
        ctx.shadowColor = 'rgba(' + tm.col + ',.9)'; ctx.shadowBlur = 10 * tm.on;
      }
      ctx.fillStyle = 'rgba(' + tm.col + ',' + a + ')';
      ctx.fillText(tm.txt, x0, eqY);
      ctx.restore();
      x0 += widths[i + 1];
    });

    // behavior sequence streaming into the estimate (term two's scene)
    if (pb > .05 && pb < 1.05) {
      ctx.font = (Math.min(15, w * .022)) + 'px sans-serif';
      events.forEach(function (ev) {
        var prog = ((t * .35 + ev.off) % 3) / 3;
        var ex = lerp(-.05, .5, prog) * w;
        var ey = h * .2 + Math.sin(prog * 6) * 8;
        ctx.globalAlpha = pb * clamp(Math.sin(prog * Math.PI) * 1.4, 0, 1) * .9;
        ctx.fillText(ev.g, ex, ey);
      });
      ctx.globalAlpha = 1;
      ctx.font = '500 10px Poppins, sans-serif';
      ctx.fillStyle = 'rgba(127,200,240,' + pb * .8 + ')';
      ctx.textAlign = 'center';
      ctx.fillText(dtxt('what they did just now, in order', 'their recent actions, in sequence', 'ordered event sequence → eAR'), w * .27, h * .2 + 26);
    }

    // finalists with stacked term bars
    var barW = Math.min(34, w * .055), gap = (w * .8) / 8;
    finalists.forEach(function (f) {
      var fx = w * .1 + gap * (f.slot + .5);
      var baseY = h * .82;
      var bidH = f.bid * 60 * pa;
      var earH = f.ear * 90 * pb;
      var qH = f.q * 60 * pc;
      var col = f.you ? '254,124,43' : '125,116,160';
      // bid
      ctx.fillStyle = 'rgba(255,197,69,' + (.35 + pa * .4) + ')';
      ctx.fillRect(fx - barW / 2, baseY - bidH, barW, bidH);
      // ear
      ctx.fillStyle = 'rgba(127,200,240,' + (.35 + pb * .4) + ')';
      ctx.fillRect(fx - barW / 2, baseY - bidH - earH, barW, earH);
      // quality (can be negative: drawn red, pulling down)
      if (pc > .02) {
        if (qH >= 0) {
          ctx.fillStyle = 'rgba(143,214,148,.7)';
          ctx.fillRect(fx - barW / 2, baseY - bidH - earH - qH, barW, qH);
        } else {
          ctx.fillStyle = 'rgba(229,52,11,.65)';
          ctx.fillRect(fx - barW / 2, baseY - bidH - earH, barW, -qH);
          ctx.font = '700 11px Poppins, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = 'rgba(229,52,11,.9)';
          ctx.fillText('−', fx, baseY - bidH - earH - qH - 6);
        }
      }
      // the ad dot
      if (f.you) glow(ctx, fx, baseY + 14, 6.5, 'rgba(254,124,43,.95)', 14);
      else { ctx.fillStyle = 'rgba(' + col + ',.8)'; ctx.beginPath(); ctx.arc(fx, baseY + 14, 5, 0, 6.29); ctx.fill(); }
    });
    ctx.font = '500 10px Poppins, sans-serif';
    ctx.fillStyle = 'rgba(252,243,214,.45)';
    ctx.textAlign = 'center';
    ctx.fillText(dtxt('the eight finalists, scorecards filling in', 'the shortlist, term by term', 'shortlist · per-user terms assembling'), w / 2, h * .93);

    sc.setCap(p < .33 ? 'j.value.cap.a' : p < .68 ? 'j.value.cap.b' : 'j.value.cap.c');
  };
}

/* ---- scene 5: the auction, the render, the timer ---- */
function auctionScene(sc) {
  var finalists = [];
  sc.build = function (w, h) {
    finalists = [];
    var tvs = [.55, .72, .97, .5, .8, .42, .66, .58];  // your ad (idx 2) wins
    for (var i = 0; i < 8; i++) finalists.push({ slot: i, tv: tvs[i], you: i === 2, cur: 0 });
  };
  sc.tick = function (dt, t) {
    var ctx = sc.ctx, w = sc.w, h = sc.h, p = sc.progress;
    var pa = clamp(p / .4, 0, 1);              // race
    var pb = clamp((p - .42) / .28, 0, 1);     // price line
    var pc = clamp((p - .72) / .28, 0, 1);     // render + timer

    var baseY = h * .8, maxH = h * .5;
    var gap = (w * (pc > 0 ? .5 : .8)) / 8;
    var xoff = w * (pc > 0 ? .06 : .1);
    var runnerUp = .8;

    finalists.forEach(function (f) {
      f.cur = lerp(f.cur, f.tv * pa, dt * 3);
      var fx = xoff + gap * (f.slot + .5);
      var bh = f.cur * maxH;
      var col = f.you ? '254,124,43' : '125,116,160';
      ctx.fillStyle = 'rgba(' + col + ',' + (f.you ? .9 : .55) + ')';
      ctx.beginPath();
      ctx.roundRect(fx - 13, baseY - bh, 26, bh, 6);
      ctx.fill();
      if (f.you && pa > .9) {
        glow(ctx, fx, baseY - bh - 14, 5, 'rgba(255,197,69,.95)', 14);
        ctx.font = '700 12px Poppins, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255,197,69,.95)';
        ctx.fillText(dtxt('winner!', 'highest total value', 'clears'), fx, baseY - bh - 26);
      }
    });

    // the pay-the-minimum line
    if (pb > .02) {
      var ly = baseY - runnerUp * maxH - 4;
      ctx.setLineDash([7, 6]);
      ctx.strokeStyle = 'rgba(255,197,69,' + pb * .85 + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(xoff - 6, ly); ctx.lineTo(xoff + gap * 8 + 6, ly); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '600 11px Poppins, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,197,69,' + pb * .9 + ')';
      ctx.fillText(dtxt('pays just a whisker above this line', 'pays the minimum needed — this line, not the bid', 'clearing price: runner-up value, backed out'), xoff, ly - 8);
    }

    // the phone renders the winning ad
    if (pc > .02) {
      var phX = w * .76, phY = h * .5, phW = Math.min(120, w * .2), phH = phW * 1.9;
      ctx.globalAlpha = pc;
      ctx.strokeStyle = 'rgba(252,243,214,.85)';
      ctx.lineWidth = 3;
      ctx.fillStyle = 'rgba(26,16,37,.95)';
      ctx.beginPath(); ctx.roundRect(phX - phW / 2, phY - phH / 2, phW, phH, 16); ctx.fill(); ctx.stroke();
      // feed lines
      ctx.fillStyle = 'rgba(252,243,214,.18)';
      ctx.fillRect(phX - phW / 2 + 10, phY - phH / 2 + 14, phW - 20, 8);
      ctx.fillRect(phX - phW / 2 + 10, phY - phH / 2 + 28, phW * .5, 8);
      // the ad slides in
      var slide = lerp(40, 0, pc);
      ctx.fillStyle = 'rgba(254,124,43,' + pc * .95 + ')';
      ctx.beginPath();
      ctx.roundRect(phX - phW / 2 + 10, phY - 14 + slide, phW - 20, phH * .32, 8);
      ctx.fill();
      ctx.font = '700 10px Poppins, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(254,124,43,.9)';
      ctx.fillText(dtxt('your sign!', 'your ad', 'your ad'), phX, phY + phH / 2 + 16);
      ctx.globalAlpha = 1;

      // the timer
      var ms = Math.round(lerp(0, 103, clamp(pc * 1.3, 0, 1)));
      ctx.font = '800 ' + Math.min(30, w * .045) + 'px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(252,243,214,.92)';
      ctx.fillText('~' + ms + ' ms', phX, phY - phH / 2 - 18);
      ctx.font = '500 10px Poppins, sans-serif';
      ctx.fillStyle = 'rgba(252,243,214,.5)';
      ctx.fillText(dtxt('the whole journey', 'request to render', 'end-to-end latency'), phX, phY - phH / 2 - 4);
    }

    sc.setCap(p < .42 ? 'j.auct.cap.a' : p < .72 ? 'j.auct.cap.b' : 'j.auct.cap.c');
  };
}

/* ---------------- journey lifecycle ---------------- */
function journeyStart() {
  J.active = true;
  J.scenes = {};
  J.running = new Set();
  document.querySelectorAll('.jstep').forEach(function (sec) {
    var name = sec.dataset.scene;
    var sc = sceneBase(sec);
    SCENE_FACTORIES[name](sc);
    J.scenes[name] = sc;
  });
  J.io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      var name = en.target.dataset.scene;
      if (en.isIntersecting) J.running.add(name); else J.running.delete(name);
    });
  }, { rootMargin: '80px 0px' });
  document.querySelectorAll('.jstep').forEach(function (s) { J.io.observe(s); });

  // tap-to-advance on touch devices
  document.querySelectorAll('.jnext').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var step = btn.closest('.jstep');
      var next = step.nextElementSibling;
      var target = next && next.classList.contains('jstep')
        ? next.offsetTop + 10
        : step.offsetTop + step.offsetHeight;
      window.scrollTo({ top: target, behavior: 'smooth' });
    });
  });

  var last = performance.now();
  function loop(now) {
    if (!J.active) return;
    var dt = Math.min(.05, (now - last) / 1000);
    last = now;
    journeyScroll();
    J.running.forEach(function (name) { J.scenes[name].frame(dt); });
    J.raf = requestAnimationFrame(loop);
  }
  J.raf = requestAnimationFrame(loop);
}
function journeyScroll() {
  var vh = window.innerHeight;
  J.lastScroll = window.scrollY;
  document.querySelectorAll('.jstep').forEach(function (sec) {
    var name = sec.dataset.scene;
    if (!J.running.has(name)) return;
    J.scenes[name].progress = clamp((window.scrollY - sec.offsetTop) / (sec.offsetHeight - vh), 0, 1);
  });
}
function journeyStop() {
  J.active = false;
  cancelAnimationFrame(J.raf);
  if (J.io) J.io.disconnect();
  J.scenes = {};
}

INITS.creative = function () {
  var P = [], N = 0, mode = 'builder', alive = true, raf = 0, t = 0;
  var sel = { hook: -1, visual: -1, tone: -1, proof: -1 };
  var scoreB = null, sig = 0, sA = null, sB = null, conceptOf = null;
  var cv = $('cfCanvas'), ctx = cv.getContext('2d'), W = 0, H = 0, DPR = 1;

  function makeP() {
    var a = Math.random(), age = a < .35 ? 0 : a < .75 ? 1 : 2;
    var ints = 0;
    if (Math.random() < (age === 1 ? .5 : .18)) ints |= CB.PARENT;
    if (Math.random() < (age === 0 ? .45 : .25)) ints |= CB.GADGET;
    if (Math.random() < .25) ints |= CB.ORAL;
    if (Math.random() < (age === 2 ? .45 : .25)) ints |= CB.HEALTH;
    if (Math.random() < .3) ints |= CB.SKEPTIC;
    if (Math.random() < .25) ints |= CB.BUDGET;
    if (Math.random() < (age === 0 ? .55 : .35)) ints |= CB.HUMOR;
    return { x: Math.random(), y: Math.random(), vx: 0, vy: 0, z: .45 + Math.random() * .55,
      tw: Math.random() * 6.28, sex: Math.random() < .5 ? 0 : 1, age: age, ints: ints,
      glow: 0, gT: 0, col: 0, offR: .35 + Math.random() * .65, offA: Math.random() * 6.28, anchor: 0 };
  }
  function resize() {
    var r = cv.parentElement.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    var target = clamp(Math.round(W * H / 300), 700, 2000);
    while (P.length < target) P.push(makeP());
    P.length = N = target;
    retarget();
  }
  function chipScore(c, p) {
    if (c.flat) return .48 + (((p.ints * 7 + p.age * 13) % 10) / 10 - .5) * .06;
    var iW = .15;
    for (var bit in c.ints) if (p.ints & bit) iW = Math.max(iW, c.ints[bit]);
    return .4 * c.ages[p.age] + .6 * iW;
  }
  function selIdxs() { return CCATS.map(function (c) { return sel[c]; }).filter(function (i) { return i >= 0; }); }
  function computeBuilder() {
    var idxs = selIdxs();
    scoreB = new Float32Array(N);
    if (idxs.length) {
      for (var i = 0; i < N; i++) {
        var s = 0;
        idxs.forEach(function (ci) { s += chipScore(CCHIPS[ci], P[i]); });
        scoreB[i] = s / idxs.length;
      }
      var spec = idxs.reduce(function (s, ci) { return s + CCHIPS[ci].spec; }, 0) / idxs.length;
      sig = spec * (.45 + .55 * idxs.length / 4);
    } else sig = 0;
  }
  function predA(p) { return .5 * ((p.ints & CB.PARENT) ? 1 : 0) + .3 * (p.sex === 0 ? 1 : 0) + .25 * (p.age === 1 ? 1 : 0) + Math.random() * .1; }
  function predB(p) { return .45 * ((p.ints & CB.BUDGET) ? 1 : 0) + .32 * (p.sex === 1 ? 1 : 0) + .28 * (p.age === 2 ? 1 : 0) + Math.random() * .1; }
  function retarget() {
    if (mode === 'builder') { computeBuilder(); updateReadout(); }
    else if (mode === 'divergent' || mode === 'similar') {
      sA = new Float32Array(N); sB = new Float32Array(N);
      for (var i = 0; i < N; i++) {
        if (mode === 'divergent') { sA[i] = predA(P[i]); sB[i] = predB(P[i]); }
        else { var base = predA(P[i]); sA[i] = base + Math.random() * .06; sB[i] = base + Math.random() * .06; }
      }
      updateReadout();
    } else if (mode === 'div25' || mode === 'div5') {
      conceptOf = new Int16Array(N);
      for (var j = 0; j < N; j++) {
        var p = P[j];
        if (mode === 'div25') {
          conceptOf[j] = (Math.random() < .72) ? ((p.ints * 31 + p.age * 7 + p.sex * 3) % 25) : -1;
        } else {
          conceptOf[j] = (predA(p) > .6) ? (j % 5) : -1;
        }
      }
      updateReadout();
    }
  }
  function anchor25(c) {
    var col = c % 5, row = Math.floor(c / 5);

  }
  function anchor5(c) { return { x: .3 + (c % 5) * .1, y: .42 + (c % 2) * .08 }; }

  function updateReadout() {

    if (!pEl) return;
    ex.innerHTML = '';
    if (mode === 'builder') {
      var idxs = selIdxs();
      if (!idxs.length) {

        nEl.textContent = '—'; tEl.style.width = '0%';
        cap.innerHTML = d3('c.intro') ? dtxt('every dot is a person — build them an ad', 'the field idles — assemble a concept', 'idle field; N=' + N) : '';
        return;
      }
      var matched = 0, tally = {}, pop = {};
      for (var i = 0; i < N; i++) {
        for (var bit in CPERSONA) { if (P[i].ints & bit) pop[bit] = (pop[bit] || 0) + 1; }
        if (scoreB[i] < .66) continue;
        matched++;
        for (var b2 in CPERSONA) if (P[i].ints & b2) tally[b2] = (tally[b2] || 0) + 1;
      }
      nEl.textContent = matched;
      tEl.style.width = Math.round(sig * 100) + '%';
      if (matched > 12) {
        var lift = function (b) { return ((tally[b] || 0) / matched) / Math.max((pop[b] || 1) / N, .02); };
        var top = Object.keys(CPERSONA).filter(function (b) { return (tally[b] || 0) / matched > .3; })
          .sort(function (a, b) { return lift(b) - lift(a); })[0];
        pEl.textContent = top ? CPERSONA[top][depth === 'kid' ? 0 : 1] : dtxt('a bit of everyone', 'a broad blend', 'low-lift blend');
      } else pEl.textContent = dtxt('…nobody in particular showed up', '…no resolvable cohort', 'sub-threshold: no cohort');
      cap.innerHTML = sig < .28
        ? dtxt('a whistle nobody can hear…', 'weak signal — the crowd dissolves', 'sub-threshold signal: scatter')
        : sig < .6 ? dtxt('a little crowd is forming!', 'partial resolution — sharpen a chip', 'partial resolution')
        : dtxt('look at them huddle!', 'tight cohort — the ad found its people', 'high-resolution cohort assembled');
    } else if (mode === 'divergent') {
      var an = 0, af = 0, bn = 0, bm = 0;
      for (var k = 0; k < N; k++) {
        if (sA[k] > .6 && sA[k] > sB[k]) { an++; if (P[k].sex === 0) af++; }
        else if (sB[k] > .6) { bn++; if (P[k].sex === 1) bm++; }
      }
      pEl.textContent = dtxt('one box, two secret crowds', 'one ad set, two silent audiences', 'divergent assignment, one ad set');
      nEl.textContent = (an + bn); tEl.style.width = '70%';
      ex.innerHTML = '<table class="split-table"><tr><th>creative</th><th>reached</th><th>skew</th></tr>' +
        '<tr><td style="color:var(--your-ad)">A · kid demo</td><td>' + an + '</td><td>' + Math.round(af / Math.max(an, 1) * 100) + '% women, 25–44</td></tr>' +
        '<tr><td style="color:var(--gold)">B · deal hook</td><td>' + bn + '</td><td>' + Math.round(bm / Math.max(bn, 1) * 100) + '% men, 45+</td></tr></table>';
      cap.innerHTML = dtxt('same box — totally different people got each ad!', 'identical settings — systematically different audiences', 'assignment skew under identical targeting');
    } else if (mode === 'similar') {
      var both = 0, either = 0;
      for (var m = 0; m < N; m++) {
        var a = sA[m] > .62, b = sB[m] > .62;
        if (a || b) either++;
        if (a && b) both++;
      }
      pEl.textContent = dtxt('the twins melted together', 'two “variants,” one blob', 'near-duplicate profiles: merged cohort');
      nEl.textContent = either; tEl.style.width = '30%';
      ex.innerHTML = '<p style="font-size:12.5px;color:var(--muted);margin-top:8px">overlap: <b style="color:var(--cream)">' + Math.round(both / Math.max(either, 1) * 100) + '%</b> — ' + dtxt('they’re fighting over the same people', 'bidding against themselves for one pocket', 'internal competition, zero added reach') + '</p>';
      cap.innerHTML = dtxt('two almost-same ads = one confused blob', 'cosmetic variants don’t buy diversity', 'variant similarity ⇒ cohort collapse');
    } else {
      var covered = 0;
      for (var q = 0; q < N; q++) if (conceptOf[q] >= 0) covered++;
      pEl.textContent = mode === 'div25' ? dtxt('little crowds everywhere!', '25 concepts, 25 pockets', '25-concept coverage') : dtxt('the same crowd, five times', '5×5 clones, one pocket', 'clone redundancy');
      nEl.textContent = covered; tEl.style.width = Math.round(covered / N * 100) + '%';
      ex.innerHTML = '<p style="font-size:12.5px;color:var(--muted);margin-top:8px">' + dtxt('people reached: ', 'market coverage: ', 'trait-space coverage: ') + '<b style="color:var(--cream)">' + Math.round(covered / N * 100) + '%</b></p>';
      cap.innerHTML = mode === 'div25'

        : dtxt('five copies keep finding the same crowd', 'clones re-reach one pocket five times', 'clones ⇒ oversampled single pocket');
    }
  }

  function frame(dt) {
    t += dt;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < N; i++) {
      var p = P[i];
      p.vx += (Math.random() - .5) * .012 * dt * 60; p.vy += (Math.random() - .5) * .012 * dt * 60;
      p.vx *= .92; p.vy *= .92;
      p.x += p.vx * dt * .06; p.y += p.vy * dt * .06;
      var gT = 0, col = 0, ax = .5, ay = .45, spread = .3;
      if (mode === 'builder' && sig > 0 && scoreB) {
        gT = clamp((scoreB[i] - .66) / .22, 0, 1) * clamp(sig * 1.7, 0, 1);

      } else if (mode === 'divergent' || mode === 'similar') {
        var a = sA[i], b = sB[i], th = mode === 'similar' ? .62 : .6;
        if (mode === 'similar' && Math.random() < .01 && a > th && b > th) { var tmp = sA[i]; sA[i] = sB[i]; sB[i] = tmp; }
        if (a > th && a >= b) { gT = clamp((a - th) / .3, 0, 1); col = 0; ax = mode === 'similar' ? .44 : .3; }
        else if (b > th) { gT = clamp((b - th) / .3, 0, 1); col = 1; ax = mode === 'similar' ? .56 : .7; }
        spread = mode === 'similar' ? .14 : .12;
      } else if (mode === 'div25' || mode === 'div5') {
        var c = conceptOf[i];
        if (c >= 0) {
          gT = .8; col = mode === 'div25' ? (c % 3) : 0;
          var an2 = mode === 'div25' ? anchor25(c) : anchor5(c);
          ax = an2.x; ay = an2.y; spread = mode === 'div25' ? .045 : .1;

      if (gT > .01) {

      p.glow = lerp(p.glow, p.gT, dt * 3);

      var sx = p.x * W, sy = p.y * H;
      var size = (1.5 + p.z * 2.4) * (1 + p.glow * .9);
      var alpha = (.35 + p.z * .4) * (1 + Math.sin(t * 1.4 + p.tw) * .18);
      ctx.globalAlpha = clamp(alpha, .08, 1);
      ctx.drawImage(SPRITE_BASE, sx - size, sy - size, size * 2, size * 2);
      if (p.glow > .05) {
        ctx.globalAlpha = clamp(p.glow, 0, 1);
        var gs = size * 1.9;
        ctx.drawImage(SPRITE_GLOW[p.col], sx - gs, sy - gs, gs * 2, gs * 2);
      }
    }

  function loop(now) {
    if (!alive) return;
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    frame(dt);

  }

  /* wiring */
  document.querySelectorAll('.cchip').forEach(function (b) {
    b.addEventListener('click', function () {

      var ci = parseInt(b.dataset.ci, 10);

    });

    sel = { hook: -1, visual: -1, tone: -1, proof: -1 };

    mode = 'builder'; syncChips(); retarget();

  $('cSpec').addEventListener('click', function () { preset(C_SPECIFIC); });

  $('cClr').addEventListener('click', function () { preset([]); });
  document.querySelectorAll('[data-demo]').forEach(function (b) {
    b.addEventListener('click', function () {
      mode = b.dataset.demo;
      if (mode !== 'builder') $('cfCanvas').scrollIntoView({ behavior: 'smooth', block: 'center' });

    });
  });

  document.querySelectorAll('.dial-btn').forEach(function (b) { b.addEventListener('click', dialHook); });

  window.addEventListener('resize', rs);
  resize(); preset(C_SPECIFIC);
  raf = requestAnimationFrame(loop);
  return function () {
    alive = false; cancelAnimationFrame(raf);
    window.removeEventListener('resize', rs);
    document.querySelectorAll('.dial-btn').forEach(function (b) { b.removeEventListener('click', dialHook); });
  };
};

    $('gemAgain').addEventListener('click', function () { round = 0; score = 0; renderRound(); });
  }
  renderRound();

  /* ---- part two: exhibits ---- */
  function fitCanvas(cv) {
    var r = cv.parentElement.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: r.width, h: r.height };
  }
  /* exhibit 1: cost vs frequency — no cliff, a cost-based trigger line */
  var c1mark = 3.2;
  function costOf(f) { return 1 + Math.pow((f - 1) / 5.4, 2.05) * 2.4; }
  function drawC1() {
    var cv = $('crv1'); if (!cv) return;
    var s = fitCanvas(cv), ctx = s.ctx, w = s.w, h = s.h;
    var X = function (f) { return 44 + (f - 1) / 9 * (w - 64); };
    var Y = function (c) { return h - 30 - (c - 1) / 2.6 * (h - 62); };
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(252,243,214,.3)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(44, 14); ctx.lineTo(44, h - 30); ctx.lineTo(w - 16, h - 30); ctx.stroke();
    ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(229,52,11,.75)'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(44, Y(2)); ctx.lineTo(w - 16, Y(2)); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = '600 10px Poppins, sans-serif'; ctx.fillStyle = 'rgba(229,52,11,.9)'; ctx.textAlign = 'left';
    ctx.fillText(dtxt('the fair’s real alarm: costs doubled', 'Meta’s actual trigger: cost ≥ 2× baseline', 'flag condition: CPR ≥ 2× trailing baseline'), 50, Y(2) - 6);
    ctx.strokeStyle = 'rgba(127,200,240,.9)'; ctx.lineWidth = 2.5; ctx.beginPath();
    for (var f = 1; f <= 10; f += .2) { var x = X(f), y = Y(costOf(f)); f === 1 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
    var mx = X(c1mark), my = Y(costOf(c1mark));
    ctx.fillStyle = '#ffc545'; ctx.beginPath(); ctx.arc(mx, my, 7, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(252,243,214,.9)'; ctx.textAlign = 'center'; ctx.font = '700 12px Poppins, sans-serif';
    var flag = costOf(c1mark) >= 2;
    ctx.fillText('freq ' + c1mark.toFixed(1) + '× · cost ×' + costOf(c1mark).toFixed(2) + (flag ? ' · 🚩' : ' · no flag'), w / 2, 24);
    ctx.font = '500 10px Poppins, sans-serif'; ctx.fillStyle = 'rgba(252,243,214,.5)'; ctx.textAlign = 'center';
    ctx.fillText(dtxt('how many times each person saw it →', 'frequency →', 'frequency →'), w / 2, h - 10);
    ctx.save(); ctx.translate(16, h / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillText(dtxt('cost per sale →', 'cost per result →', 'CPR vs baseline →'), 0, 0); ctx.restore();
  }
  function c1drag(e) {
    var cv = $('crv1'), r = cv.getBoundingClientRect();
    c1mark = clamp(1 + (e.clientX - r.left - 44) / (r.width - 64) * 9, 1, 10);
    drawC1();
  }
  $('crv1').addEventListener('pointerdown', function (e) { c1drag(e); $('crv1').setPointerCapture(e.pointerId); });
  $('crv1').addEventListener('pointermove', function (e) { if (e.buttons) c1drag(e); });

  /* exhibit 2: the threshold bands */
  function band() {
    var v = parseInt($('bandSlide').value, 10) / 100;
    $('bandV').textContent = v.toFixed(1) + '×';
    var st = $('bandStamp');
    if (v < 1.5) { st.textContent = dtxt('✅ healthy — the fair is happy', '✅ healthy', '✅ within band'); st.style.color = 'var(--green)'; }
    else if (v < 2) { st.textContent = dtxt('🟡 “creative limited” — the yellow note', '🟡 Creative Limited (elevated, under 2×)', '🟡 Creative Limited band'); st.style.color = 'var(--gold)'; }
    else { st.textContent = dtxt('🚩 “creative fatigue” — the red note', '🚩 Creative Fatigue (≥ 2× baseline)', '🚩 Fatigue flag threshold crossed'); st.style.color = '#ff8a70'; }
  }
  $('bandSlide').addEventListener('input', band); band();

  /* exhibit 3: the 45% study, with caveats */
  var c3mark = 4, caveatsOn = 0;
  var PERF = [100, 88, 74, 62, 55, 51, 48, 46];
  function drawC3() {
    var cv = $('crv3'); if (!cv) return;
    var s = fitCanvas(cv), ctx = s.ctx, w = s.w, h = s.h;
    ctx.clearRect(0, 0, w, h);
    var bw = (w - 70) / 8;
    PERF.forEach(function (p, i) {
      var x = 50 + i * bw, bh = p / 100 * (h - 66);
      var hot = (i + 1) === Math.round(c3mark);
      ctx.fillStyle = hot ? 'rgba(255,197,69,.9)' : (i >= 3 ? 'rgba(229,52,11,.45)' : 'rgba(127,200,240,.55)');
      ctx.beginPath(); ctx.roundRect(x, h - 30 - bh, bw - 8, bh, 4); ctx.fill();
      ctx.font = '600 9.5px Poppins, sans-serif'; ctx.fillStyle = 'rgba(252,243,214,.6)'; ctx.textAlign = 'center';
      ctx.fillText(String(i + 1), x + (bw - 8) / 2, h - 14);
      if (hot) { ctx.fillStyle = 'rgba(252,243,214,.95)'; ctx.font = '700 12px Poppins, sans-serif'; ctx.fillText(p + '%', x + (bw - 8) / 2, h - 40 - bh); }
    });
    ctx.font = '600 11px Poppins, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(252,243,214,.75)';
    ctx.fillText(dtxt('strength of the ad after N views', 'relative performance by exposure count', 'performance index vs exposure (2022 study)'), 50, 20);
    if (caveatsOn > 0) {
      ctx.fillStyle = 'rgba(127,200,240,.13)'; ctx.fillRect(0, 0, w, h);
      ctx.font = 'italic 600 12px Poppins, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(127,200,240,.95)';
      ctx.fillText(dtxt('…but the study didn’t check everything (' + caveatsOn + ' caveat' + (caveatsOn > 1 ? 's' : '') + ' on)', 'correlation with ' + caveatsOn + ' acknowledged confound' + (caveatsOn > 1 ? 's' : '') + ' — not clean causation', caveatsOn + ' confound(s) active: exposure ∝ time ∝ everything else'), w / 2, h / 2);
    }
  }
  function c3drag(e) {
    var cv = $('crv3'), r = cv.getBoundingClientRect();
    c3mark = clamp(1 + (e.clientX - r.left - 50) / (r.width - 70) * 8, 1, 8);
    drawC3();
  }
  $('crv3').addEventListener('pointerdown', function (e) { c3drag(e); });
  $('crv3').addEventListener('pointermove', function (e) { if (e.buttons) c3drag(e); });
  document.querySelectorAll('.caveat').forEach(function (b) {
    b.addEventListener('click', function () {
      b.classList.toggle('on');
      caveatsOn = document.querySelectorAll('.caveat.on').length;
      drawC3();
    });
  });

  function redrawAll() { drawC1(); drawC3(); }
  redrawAll();
  var dialRedraw = function () { setTimeout(redrawAll, 30); };
  document.querySelectorAll('.dial-btn').forEach(function (b) { b.addEventListener('click', dialRedraw); });
  window.addEventListener('resize', dialRedraw);
  return function () {
    document.querySelectorAll('.dial-btn').forEach(function (b) { b.removeEventListener('click', dialRedraw); });
    window.removeEventListener('resize', dialRedraw);
  };
};

      if (Math.abs(cm - mid) < best) { best = Math.abs(cm - mid); idx = i; }

  }

    hall.scrollTo({ left: cards[idx].offsetLeft - (hall.clientWidth - cards[idx].offsetWidth) / 2, behavior: 'smooth' });
