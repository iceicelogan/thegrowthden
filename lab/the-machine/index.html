      '<span style="font-size:13px;color:var(--muted);line-height:1.55">' + d3('a.next') + '</span></a>' +
    '</div>';
}

INITS.auction = function () {
  var comps = [];
  function rollComps() {
    var tiers = [2, 4, 6, 8, 11, 13, 16, 20];
    comps = tiers.map(function (t) {
      var prod = t * (.85 + Math.random() * .3);
      // stronger competitors carry stronger creative, so the product survives intact
      var cs = clamp(2 + Math.round((t / 3 + Math.random() * 2) * 2) / 2, 2, 8);
      return { bid: clamp(prod / cs, .5, 8), cs: cs, fresh: .6 + Math.random() * .4 };
    });
  }
  rollComps();
  var AU = { bid: 2.5, cs: 5, fresh: 1, day: 1, q4: false, bait: false, cap: false, auto: false };
  var T = { auc: 0, wins: 0, paySum: 0, spend: 0, results: 0, capSkips: 0 };
  var CAP_VAL = 1.5, animQ = [], curAnim = null, animT = 0, raf = 0, autoTm = 0, alive = true;

  function uar() { return .012 * AU.cs * AU.fresh; }
  function uq() { return AU.cs * AU.fresh * 6 + (AU.bait ? -35 : 0); }
  function ctv(c, n) { return (c.bid * (AU.q4 ? 1.25 : 1) * (.012 * c.cs * c.fresh) * 1000 + c.cs * c.fresh * 6) * n; }

  function runAuction(record) {
    var pool = comps.slice();
    if (AU.q4) pool = pool.concat([{ bid: 3, cs: 5.5, fresh: .9 }, { bid: 2.5, cs: 5, fresh: .9 }]);
    pool.sort(function () { return Math.random() - .5; });
    var field = pool.slice(0, 4).map(function (c) { return { v: ctv(c, .85 + Math.random() * .3) }; });
    var un = .85 + Math.random() * .3;
    var uv = (AU.bid * uar() * 1000 + uq()) * un;
    var all = field.concat([{ v: uv, you: true }]).sort(function (a, b) { return b.v - a.v; });
    T.auc++;
    var res = { bars: all, pay: null, capped: false, won: false };
    if (all[0].you) {
      var needed = clamp((all[1].v - uq() * un) / (uar() * 1000 * un), .05, AU.bid);
      if (AU.cap && needed > CAP_VAL) {
        T.capSkips++; res.capped = true;
      } else {
        T.wins++; T.paySum += needed; T.spend += needed; res.won = true; res.pay = needed;
        if (Math.random() < clamp(uar() * 6, .02, .85)) T.results++;
      }
    }
    if (record) animQ.push(res);
    return res;
  }
  function drift() {
    comps.forEach(function (c) {
      c.bid = clamp(c.bid + (Math.random() - .5) * .3, .5, 5.5);
      if (Math.random() < .15) c.cs = clamp(c.cs + (Math.random() < .5 ? -.5 : .5), 2, 8);
      c.fresh = clamp(c.fresh + (Math.random() - .45) * .08, .4, 1);
    });
  }
  function runDay(silent) {
    for (var i = 0; i < 120; i++) runAuction(!silent && i % 12 === 0);
    AU.day++; AU.fresh = Math.max(.4, AU.fresh * .93);
    drift();
    if (!silent) setCapEl('a.cap.running');
    syncUI();
  }
  function resetT(note) {
    T = { auc: 0, wins: 0, paySum: 0, spend: 0, results: 0, capSkips: 0 };
    if (note) setCapEl('a.cap.reset');
    syncUI();
  }
  function setCapEl(key) { var el = $('auCap'); if (el) el.innerHTML = d3(key); }
  function fm(v) { return '$' + v.toFixed(2); }
  function syncUI() {
    if (!$('stDay')) return;
    $('auBidV').textContent = fm(AU.bid);
    $('auCsV').textContent = AU.cs;
    $('auFrV').textContent = Math.round(AU.fresh * 100) + '%';
    $('auFrBar').style.width = Math.round(AU.fresh * 100) + '%';
    $('stDay').textContent = AU.day;
    $('stAuc').textContent = T.auc;
    $('stWin').textContent = T.auc ? Math.round(T.wins / T.auc * 100) + '%' : '—';
    var avg = T.wins ? T.paySum / T.wins : 0;
    $('stCpm').textContent = T.wins ? fm(avg) : '—';
    $('stGap').textContent = T.wins ? fm(AU.bid) + ' → ' + fm(avg) : '—';
    $('stGapSub').textContent = T.wins ? 'the gap is the pays-minimum discount' : '';
    $('stSpend').textContent = fm(T.spend);
    $('stRes').textContent = T.results + ' · ' + (T.results ? fm(T.spend / T.results) : '—');
  }

  /* silent comparison for scenario 1 */
  function measure(bid, cs, n) {
    var wins = 0, pays = 0;
    var save = { bid: AU.bid, cs: AU.cs }, saveT = T;
    AU.bid = bid; AU.cs = cs; T = { auc: 0, wins: 0, paySum: 0, spend: 0, results: 0, capSkips: 0 };
    for (var i = 0; i < n; i++) runAuction(false);
    wins = T.wins; pays = T.paySum;
    AU.bid = save.bid; AU.cs = save.cs; T = saveT;
    return { wr: wins / n, cpm: wins ? pays / wins : 0 };
  }

  /* ---- canvas ---- */
  var cv = $('auCanvas'), cx = cv.getContext('2d'), W = 0, H = 0, DPR = 1, t = 0;
  function resize() {
    var r = cv.parentElement.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  }
  resize();
  var floaters = comps.map(function (c, i) {
    return { x: .1 + Math.random() * .8, y: .15 + Math.random() * .55, ph: Math.random() * 6.28 };
  });
  var last = performance.now();
  function loop(now) {
    if (!alive) return;
    var dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.clearRect(0, 0, W, H);

    if (curAnim) {
      animT += dt;
      drawAuction(curAnim, clamp(animT / .55, 0, 1));
      if (animT > .62) curAnim = null;
    }
    if (!curAnim && animQ.length) { curAnim = animQ.shift(); animT = 0; }
    if (!curAnim) drawIdle();
    raf = requestAnimationFrame(loop);
  }
  function drawIdle() {
    floaters.forEach(function (f, i) {
      var c = comps[i];
      var x = f.x * W, y = (f.y + Math.sin(t * .8 + f.ph) * .02) * H;
      var r = 7 + c.bid * 2.2;
      cx.save();
      cx.shadowColor = 'rgba(127,200,240,.6)'; cx.shadowBlur = c.cs * 1.6;
      cx.fillStyle = 'rgba(125,116,160,' + (.4 + c.fresh * .4) + ')';
      cx.beginPath(); cx.arc(x, y, r, 0, 6.29); cx.fill();
      cx.restore();
    });
    var yx = W * .5, yy = H * .82;
    cx.save();
    cx.shadowColor = 'rgba(254,124,43,.9)'; cx.shadowBlur = 8 + AU.cs * 2;
    cx.fillStyle = 'rgba(254,124,43,' + (.55 + AU.fresh * .45) + ')';
    cx.beginPath(); cx.arc(yx, yy, 9 + AU.bid * 2.2, 0, 6.29); cx.fill();
    cx.restore();
    cx.font = '700 11px Poppins, sans-serif'; cx.textAlign = 'center';
    cx.fillStyle = 'rgba(254,124,43,.9)';
    cx.fillText(dtxt('you', 'your ad', 'your ad'), yx, yy + 28);
    cx.font = '600 11px Poppins, sans-serif';
    cx.fillStyle = 'rgba(252,243,214,.5)';
    cx.fillText(dtxt('the other stands drift and change each day', 'competitors drift daily — size = bid, glow = creative', 'competitor set · size=bid, glow=cs, alpha=freshness'), W / 2, 24);
  }
  function drawAuction(a, p) {
    var n = a.bars.length, gap = Math.min(70, W * .13);
    var x0 = W / 2 - gap * (n - 1) / 2, baseY = H * .78, maxV = a.bars[0].v;
    a.bars.forEach(function (b, i) {
      var bh = (b.v / maxV) * H * .5 * Math.min(1, p * 1.6);
      var x = x0 + gap * i;
      cx.fillStyle = b.you ? 'rgba(254,124,43,.92)' : 'rgba(125,116,160,.6)';
      cx.beginPath(); cx.roundRect(x - 16, baseY - bh, 32, bh, 6); cx.fill();
      if (i === 0 && p > .6) {
        cx.font = '700 12px Poppins, sans-serif'; cx.textAlign = 'center';
        cx.fillStyle = 'rgba(255,197,69,.95)';
        cx.fillText(a.capped ? dtxt('too pricey — you sat out', 'over your cap — skipped', 'cap gate: no entry') : dtxt('wins!', 'wins the slot', 'clears'), x, baseY - bh - 12);
      }
    });
    if (a.won && p > .7) {
      cx.font = '800 15px Poppins, sans-serif'; cx.textAlign = 'center';
      cx.fillStyle = 'rgba(143,214,148,' + clamp((p - .7) * 4, 0, 1) + ')';
      cx.fillText('paid ' + fm(a.pay) + dtxt(' (you offered ' + fm(AU.bid) + ')', ' — bid was ' + fm(AU.bid), ' · bid ' + fm(AU.bid)), W / 2, H * .12);
    }
    cx.font = '600 10px Poppins, sans-serif'; cx.textAlign = 'center';
    cx.fillStyle = 'rgba(252,243,214,.45)';
    cx.fillText(dtxt('stacks = each racer’s total score', 'bars = total value per contender', 'bars = TV per contender, this auction'), W / 2, baseY + 22);
  }
  raf = requestAnimationFrame(loop);

  /* ---- wiring ---- */
  function on(id, ev, fn) { var el = $(id); if (el) el.addEventListener(ev, fn); }
  on('auBid', 'input', function (e) { AU.bid = parseFloat(e.target.value); resetT(true); });
  on('auCs', 'input', function (e) { AU.cs = parseFloat(e.target.value); resetT(true); });
  on('auRefresh', 'click', function () { AU.fresh = 1; setCapEl('a.cap.refresh'); syncUI(); });
  on('auRun', 'click', function () { runDay(false); });
  on('auAuto', 'click', function () {
    AU.auto = !AU.auto;
    $('auAuto').classList.toggle('pressed', AU.auto);
    clearInterval(autoTm);
    if (AU.auto) autoTm = setInterval(function () { runDay(false); }, 1400);
  });
  function scen(id, fn) { on(id, 'click', fn); }
  scen('sc1', function () {
    var base = measure(AU.bid, AU.cs, 600);
    var b2 = measure(AU.bid * 2, AU.cs, 600);
    var c2 = measure(AU.bid, Math.min(10, AU.cs * 2), 600);
    $('scenCap').innerHTML = d3('a.cap.sc1');
    $('scenTable').innerHTML = '<table class="cmp-table"><tr><th>setup</th><th>win rate</th><th>effective CPM</th></tr>' +
      '<tr><td>baseline (bid ' + fm(AU.bid) + ', creative ' + AU.cs + ')</td><td>' + Math.round(base.wr * 100) + '%</td><td>' + (base.cpm ? fm(base.cpm) : '—') + '</td></tr>' +
      '<tr><td>2× bid</td><td>' + Math.round(b2.wr * 100) + '%</td><td>' + (b2.cpm ? fm(b2.cpm) : '—') + '</td></tr>' +
      '<tr class="you-row"><td>2× creative strength</td><td>' + Math.round(c2.wr * 100) + '%</td><td>' + (c2.cpm ? fm(c2.cpm) : '—') + '</td></tr></table>';
  });
  scen('sc2', function () {
    AU.q4 = !AU.q4;
    $('sc2').classList.toggle('pressed', AU.q4);
    $('scenCap').innerHTML = d3(AU.q4 ? 'a.cap.sc2on' : 'a.cap.sc2off');
    $('scenTable').innerHTML = '';
    resetT(false);
  });
  scen('sc3', function () {
    AU.bait = !AU.bait;
    $('sc3').classList.toggle('pressed', AU.bait);
    $('scenCap').innerHTML = d3(AU.bait ? 'a.cap.sc3on' : 'a.cap.sc3off');
    $('scenTable').innerHTML = '';
    resetT(false);
  });
  scen('sc4', function () {
    AU.cap = !AU.cap;
    $('sc4').classList.toggle('pressed', AU.cap);
    $('scenCap').innerHTML = d3(AU.cap ? 'a.cap.sc4on' : 'a.cap.sc4off');
    $('scenTable').innerHTML = '';
    resetT(false);
  });
  scen('sc5', function () {
    for (var i = 0; i < 5; i++) runDay(true);
    $('scenCap').innerHTML = d3('a.cap.sc5');
    $('scenTable').innerHTML = '';
    syncUI();
  });
  var rs = function () { resize(); };
  window.addEventListener('resize', rs);
  syncUI();

  return function cleanup() {
    alive = false;
    cancelAnimationFrame(raf);
    clearInterval(autoTm);
    window.removeEventListener('resize', rs);
  };
};
VIEWS.auction = viewAuction;

/* ---------------- other views ---------------- */
function viewPlaceholder(room) {
  return '<div class="view-pad">' +
    '<p class="room-kicker">The Growth Den Lab · The Machine</p>' +
    '<h1 class="room-title">' + room.ico + ' ' + room.name + '</h1>' +
    '<p class="room-tag" style="margin-bottom:26px">' + d3(room.slug + '.tag') + '</p>' +
    '<div class="card bench">' +
      '<span class="flask" aria-hidden="true">⚗️</span>' +
      '<h2>' + d3('ph.state') + '</h2>' +
      '<p class="bench-note">' + d3('ph.note') + '</p>' +
      '<p class="bench-link">permalink: <code>#/' + room.slug + '?d=' + depth + '</code></p>' +
    '</div></div>';
}

VIEWS.machine = viewJourney;
INITS.machine = function () {
  journeyStart();
  document.querySelectorAll('#pipemap .node').forEach(function (n) {
    n.addEventListener('click', function () { openDetail(n.dataset.node); });
  });
  return journeyStop;
};

function render() {
  var cur = parseHash();
  if (cur.params.d && DEPTHS.indexOf(cur.params.d) >= 0 && cur.params.d !== depth) {
    setDepth(cur.params.d, true);
  }
  canonicalizeHash();
  var room = ROOMS.filter(function (r) { return r.slug === cur.slug; })[0];
  CLAIMS.length = 0;
  popover.hidden = true;
  detail.hidden = true;
  if (roomCleanup) { try { roomCleanup(); } catch (e) { } roomCleanup = null; }
  var view = $('view');
  view.innerHTML = VIEWS[room.slug] ? VIEWS[room.slug]() : viewPlaceholder(room);
  view.style.animation = 'none';
  void view.offsetWidth;
  view.style.animation = '';
  renderTabs(room.slug);
  if (INITS[room.slug]) roomCleanup = INITS[room.slug]() || null;
  document.title = (room.slug === 'machine' ? 'The Machine' : room.name + ' · The Machine') +
    ' — The Growth Den Lab';
  window.scrollTo(0, 0);
}

/* ---------------- wire up ---------------- */
document.querySelectorAll('.dial-btn').forEach(function (b) {
  b.addEventListener('click', function () {
    setDepth(b.dataset.depth, false);
    document.querySelectorAll('.bench-link code').forEach(function (c) {
      c.textContent = '#/' + parseHash().slug + '?d=' + depth;
    });
  });
});
window.addEventListener('hashchange', render);
var rsTm;
window.addEventListener('resize', function () {
  clearTimeout(rsTm);
  rsTm = setTimeout(function () {
    Object.keys(J.scenes).forEach(function (k) { J.scenes[k].ready = false; });
  }, 150);
});

setDepth(depth, true);
render();
})();
